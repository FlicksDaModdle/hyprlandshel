# The shell's Rust helpers, built by ../install.sh when cargo is there:
#
#   hyprshell-daemon   network, backlight, audio-device and night-light
#                      state for the shell, from D-Bus, sysfs and PulseAudio
#                      directly — in place of polling nmcli, brightnessctl,
#                      pactl and pgrep (see ../quickshell/services/Daemon.qml)
#   hyprshell-cursors  builds the accent cursor theme, drawn with resvg (in
#                      place of the Qt one in ../agent, which needs qt6-svg)
[workspace]
members = ["daemon", "cursors"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
