# Hyprshell — kitty config.
#
# Matched to the terminal window in the Claude Design mockup: its padding, its
# airy line height, its flat chrome, and the same design tokens the shell's own
# panels are built from.
#
# The palette lives in hyprshell-colors.conf, which just includes one of
# colors-light.conf / colors-dark.conf. The shell rewrites that line when you
# change theme and signals kitty to reload, so the terminal follows the rest of
# the desktop. Nothing here depends on the shell running — edit the include by
# hand and this works standalone.

# ── typography ───────────────────────────────────────────────────────────────
# The mockup renders its terminal in Inter, because it is a mockup and the text
# is fake. Real terminal output needs fixed advance widths, so this uses the
# shell's mono token (Appearance.monoFamily) and keeps Inter for nothing.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# The mockup's terminal text is 13px. kitty sizes in points, so at 96dpi that
# is about 9.8pt — too small for real work on most displays, so this sits at a
# readable default. Change it to 9.8 if you want the mockup's exact measure.
font_size 11.0

# The mockup's 1.62 line height. It is unusually airy for a terminal and that
# airiness is a lot of what makes the design look like itself. Drop it to 120%
# if you would rather see more lines at once.
#
# adjust_line_height is the old spelling of this and is deprecated; cell_height
# is what kitty reads now.
modify_font cell_height 162%

disable_ligatures never

# ── window ───────────────────────────────────────────────────────────────────
# The mockup pads its terminal 16px top, 18px sides, 20px bottom.
window_padding_width 16 18 20 18

# Hyprland draws the frame: the 12px rounding, the hairline border, and the
# accent border on the focused window, all set in hyprland.lua. kitty drawing
# its own decoration or border on top would double it.
#
# The mockup's per-window title bar — bead, icon, title, subtitle — is drawn by
# the shell for its own windows. No client can draw that for itself, so the
# real equivalent here is Hyprland's accent border marking focus.
hide_window_decorations yes
window_border_width 0
# Ask once before closing a window that still has more than one
# tab or split in it, so a stray key doesn't take work with it.
confirm_os_window_close -1

# Set in the palette files; declared here so kitty allows live changes.
dynamic_background_opacity yes

# ── tab bar ──────────────────────────────────────────────────────────────────
# Flat and quiet, like every other surface in this design — no powerline
# slants. Hidden until there is actually more than one tab, so a lone window
# is just content inside Hyprland's border, which is what the mockup shows.
tab_bar_edge          top
tab_bar_style         separator
tab_bar_align         left
tab_bar_min_tabs      2
tab_separator         "  "
tab_bar_margin_width  8.0
tab_bar_margin_height 6.0 4.0
active_tab_font_style bold
inactive_tab_font_style normal

# ── cursor ───────────────────────────────────────────────────────────────────
# The mockup's prompt ends in a solid block that does not blink.
cursor_shape block
cursor_blink_interval 0

# ── behaviour ────────────────────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

mouse_hide_wait 2.0
url_style curly
detect_urls yes
copy_on_select no
strip_trailing_spaces smart

# Matches hyprland.lua's SUPER-based bindings rather than fighting them.
kitty_mod ctrl+shift
map kitty_mod+t new_tab
map kitty_mod+w close_tab

# Closing. hide_window_decorations means there is no titlebar X to aim at, so
# there has to be a key for it. super+Q closes any window compositor-side
# (see hyprland.lua); these are kitty's own, for closing one split or tab
# without taking the whole window with it.
map kitty_mod+q close_window
map ctrl+shift+delete close_os_window
map kitty_mod+enter new_window
map kitty_mod+f5 load_config_file
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0 change_font_size all 0

# The shell recolours running windows by rewriting the include below and
# sending SIGUSR1, which is a plain config reload — no remote control needed,
# so this stays off.
allow_remote_control no

# ── palette ──────────────────────────────────────────────────────────────────
# Keep this last so a hand-edited colour above it doesn't get overridden.
include hyprshell-colors.conf
