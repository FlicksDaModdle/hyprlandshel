# Hyprshell — light terminal palette.
#
# Generated, not hand-picked. The sixteen ANSI colours are laid out on one
# shared OKLCH lightness scale, which is the method the shell's own design
# tokens use, so a green and a blue at the same step read as the same
# visual weight. Red sits at the design accent's exact hue and chroma
# (31.5°, 0.21); every other hue is pulled back to roughly 0.13 so the
# accent stays the only loud colour on screen.
#
# Every normal colour clears 4.5:1 against the background, the brights 6.5:1.
#
# Red does NOT follow your chosen accent. ANSI colours should mean what they
# say — a blue accent must not make error text blue. The accent drives the
# cursor, selection, links and the tab bead instead.

background            #faf9f9
foreground            #201e1d
background_opacity    0.90

# Accent-driven chrome
cursor                #ec3013
cursor_text_color     #fff8f6
selection_background  #ec3013
selection_foreground  #fff8f6
url_color             #ae1800

# Hyprland draws the window border, so kitty's own is left off; these only
# show if you re-enable window_border_width.
active_border_color   #ec3013
inactive_border_color #605d5d
bell_border_color     #ec3013

# Tab bar. The accent bar before the active title is kitty's nearest
# equivalent of the focus bead on the mockup's window title bar.
tab_bar_background      #eae9e9
active_tab_background   #eae9e9
active_tab_foreground   #201e1d
inactive_tab_background #eae9e9
inactive_tab_foreground #6b6868
active_tab_title_template   "{fmt.fg._ec3013}▍ {fmt.fg.tab}{title}"
tab_title_template          "  {title}"

# ANSI 16. Each pair is the normal colour and its bright, so you read the
# two weights of one hue together.
#
# kitty strips only whole-line comments, so these labels cannot sit at the
# end of a value line — an inline # becomes part of the colour and the line
# is rejected.

# black
color0               #2d2b2b
color8               #605d5d

# red — color9 is the design accent exactly, because that is the red the
# concept's terminal shows on its bold prompt (alex@kestrel). It is 4.0:1 on
# this background: under AA for body text, over the 3:1 bold threshold, and
# bold is the only weight a shell renders color9 at. Plain red output stays
# on color1 at 5.5:1, so an error message is still comfortably readable.
color1               #ca1800
color9               #ec3013

# green
color2               #338039
color10              #146720

# yellow
color3               #8c6700
color11              #6d5000

# blue
color4               #2c6dbc
color12              #0c54a0

# magenta
color5               #964e91
color13              #7b3577

# cyan
color6               #007e7e
color14              #006363

# white
color7               #d7d3d3
color15              #f8f4f4
