[package]
name = "hyprshell-camera"
version = "0.1.0"
edition = "2021"
description = "Camera for Hyprshell: the webcam, photos and videos"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
