[package]
name = "hyprshell-video"
version = "0.1.0"
edition = "2021"
description = "Videos for Hyprshell: mpv's playback in the shell's own window"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
# mpv is found when the app starts, not when it's built: no mpv, no crash —
# the app says so.
libloading = "0.8"
glow = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
