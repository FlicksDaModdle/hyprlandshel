[package]
name = "hyprshell-docs"
version = "0.1.0"
edition = "2021"
description = "Documents for Hyprshell: PDFs, comics and e-books"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
hayro = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[build-dependencies]
slint-build = { workspace = true }
