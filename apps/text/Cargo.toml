[package]
name = "hyprshell-text"
version = "0.1.0"
edition = "2021"
description = "Text Editor for Hyprshell: plain text and code, in tabs, with find and replace"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
