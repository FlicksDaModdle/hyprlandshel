[package]
name = "hyprshell-rog"
version = "0.1.0"
edition = "2021"
description = "ROG Control Center for Hyprshell: profiles, fans, keyboard, battery and graphics on ASUS laptops"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
slint-build = { workspace = true }
