[package]
name = "hyprshell-disks"
version = "0.1.0"
edition = "2021"
description = "Disks for Hyprshell: drives, partitions, health and speed, through UDisks2"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
serde = "1"

[build-dependencies]
slint-build = { workspace = true }
