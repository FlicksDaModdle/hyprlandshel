[package]
name = "hyprshell-recorder"
version = "0.1.0"
edition = "2021"
description = "Sound Recorder for Hyprshell: voice memos and system sound, saved as FLAC or WAV"

[dependencies]
hyprshell-kit = { workspace = true }
hyprshell-audio = { path = "../audio" }
slint = { workspace = true }
hound = "3.5"
flacenc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
