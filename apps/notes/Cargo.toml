[package]
name = "hyprshell-notes"
version = "0.1.0"
edition = "2021"
description = "Notes for Hyprshell: Markdown files in ~/Notes, with folders, search and a live preview"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
