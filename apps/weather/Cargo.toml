[package]
name = "hyprshell-weather"
version = "0.1.0"
edition = "2021"
description = "Weather for Hyprshell: your places, now, the next day and ten days ahead, from Open-Meteo"

[dependencies]
hyprshell-kit = { workspace = true }
slint = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { workspace = true }
