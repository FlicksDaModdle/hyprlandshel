[package]
name = "hyprshell-rs"
version = "0.1.0"
edition = "2021"
description = "Hyprshell's shell in Rust: bar, dock, panels and the rest, on Hyprland's layer-shell"
license = "MIT"

[[bin]]
name = "hyprshell-rs"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
# xkbcommon: the keymap, so what is typed into the launcher is what the
# keyboard layout says.
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
# The dock matches windows to pinned apps by the patterns theme.json keeps.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Pictures: album art, notification images and tray/app icons. PNG and
# JPEG decoded, SVG drawn at the size it is shown.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48", default-features = false }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
