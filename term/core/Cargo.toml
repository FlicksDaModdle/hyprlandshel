[package]
name = "hyprterm-core"
version = "1.0.0"
edition = "2021"
description = "Hyprterm's terminal emulation: alacritty_terminal behind a C interface"
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
alacritty_terminal = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
