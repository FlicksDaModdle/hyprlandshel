// Hyprshell Browser bootstrap. (Firefox skips the first line of this file.)
//
// Everything real lives in hyprshell/, which is served as resource://hyprshell/
// so the modules can import each other by URL. This file only makes that
// mapping and starts the loader; a failure here is logged and the browser
// comes up as plain Firefox rather than not at all.
// Defaults this browser needs, before any window opens. defaultPref, so
// about:config can still change any of them.
//
// Context menus drawn by Firefox rather than handed to GTK: a GTK menu is a
// native widget no stylesheet reaches, which is why the old theme could never
// restyle the right-click menu.
defaultPref("widget.gtk.native-context-menus", false);
// Tabs in the title row, as in the concept.
defaultPref("browser.tabs.inTitlebar", 1);
// A userChrome.css in the profile still applies on top, for anyone who wants it.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("browser.tabs.tabMinWidth", 84);
// Its own browser: it does not ask to be Firefox's replacement every start.
defaultPref("browser.shell.checkDefaultBrowser", false);

// HYPRSHELL_BROWSER_PLAIN=1 starts it as plain Firefox — same install,
// same profile, none of this interface — to tell whether something that goes
// wrong is this layer's doing or not.
if (Services.env.get("HYPRSHELL_BROWSER_PLAIN")) {
  Cu.reportError("hyprshell: HYPRSHELL_BROWSER_PLAIN is set — running as plain Firefox");
} else try {
  const dir = Services.dirsvc.get("GreD", Ci.nsIFile);
  dir.append("hyprshell");
  Services.io.getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("hyprshell", Services.io.newFileURI(dir));
  ChromeUtils.importESModule("resource://hyprshell/Loader.sys.mjs").Loader.start();
} catch (e) {
  Cu.reportError("hyprshell: bootstrap failed: " + e + "\n" + (e.stack || ""));
}
